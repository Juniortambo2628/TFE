name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test and Autofix"]
    types:
      - completed
    branches:
      - main

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, bcmath, pdo_mysql, curl, zip, gd, fileinfo, dom, exif, iconv
        coverage: none

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install Composer dependencies (production)
      run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

    - name: Install Node dependencies
      run: npm ci --legacy-peer-deps

    - name: Build production assets
      run: npm run build

    - name: Assemble deployment package
      # rsync is fine here — this runs on ubuntu-latest, not the production server
      run: |
        set -euo pipefail
        mkdir -p deploy-package/backend deploy-package/frontend

        rsync -a \
          --exclude='.env' \
          --exclude='.env.example' \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='tests' \
          --exclude='public' \
          --exclude='storage/framework' \
          --exclude='storage/logs' \
          --exclude='storage/app/public' \
          --exclude='deploy-package' \
          --exclude='*.md' \
          --exclude='.phpunit.result.cache' \
          --exclude='production_env.txt' \
          ./ deploy-package/backend/

        mkdir -p deploy-package/frontend/build
        cp -r public/build/. deploy-package/frontend/build/
        cp public/.htaccess deploy-package/frontend/.htaccess

        # Generate frontend index.php with paths pointing to backend
        sed \
          -e "s|__DIR__.'/../storage/|__DIR__.'/../tfe-core/storage/|g" \
          -e "s|__DIR__.'/../vendor/|__DIR__.'/../tfe-core/vendor/|g" \
          -e "s|__DIR__.'/../bootstrap/|__DIR__.'/../tfe-core/bootstrap/|g" \
          public/index.php > deploy-package/frontend/index.php

    - name: Package archives for transfer
      # tar + scp instead of rsync — production server lacks rsync
      run: |
        set -euo pipefail
        tar -czf backend.tar.gz -C deploy-package/backend .
        tar -czf frontend-build.tar.gz -C deploy-package/frontend/build .

    - name: Upload backend archive
      uses: actions/upload-artifact@v4
      with:
        name: backend-archive
        path: backend.tar.gz
        retention-days: 1

    - name: Upload frontend archive
      uses: actions/upload-artifact@v4
      with:
        name: frontend-archive
        path: |
          frontend-build.tar.gz
          deploy-package/frontend/.htaccess
          deploy-package/frontend/index.php
        retention-days: 1

  deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (for post-deploy scripts)
      uses: actions/checkout@v4

    - name: Download backend archive
      uses: actions/download-artifact@v4
      with:
        name: backend-archive
        path: archives

    - name: Download frontend archive
      uses: actions/download-artifact@v4
      with:
        name: frontend-archive
        path: archives

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

    - name: Transfer backend archive
      run: |
        scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
          archives/backend.tar.gz \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/backend-${{ github.sha }}.tar.gz"

    - name: Transfer frontend build archive
      run: |
        scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
          archives/frontend-build.tar.gz \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/frontend-build-${{ github.sha }}.tar.gz"

    - name: Transfer frontend entrypoint files
      run: |
        scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
          archives/deploy-package/frontend/.htaccess archives/deploy-package/frontend/index.php \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.FRONTEND_PATH }}/"

    - name: Extract, post-deploy, and verify
      run: |
        ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "BACKEND_PATH='${{ secrets.BACKEND_PATH }}' FRONTEND_PATH='${{ secrets.FRONTEND_PATH }}' RELEASE_SHA='${{ github.sha }}' bash -s" \
          < scripts/post-deploy.sh

    - name: Verify deployed file structure
      run: |
        ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "BACKEND_PATH='${{ secrets.BACKEND_PATH }}' FRONTEND_PATH='${{ secrets.FRONTEND_PATH }}' bash -s" \
          < scripts/verify-deploy.sh

    - name: Clean up
      if: always()
      run: rm -rf ~/.ssh/deploy_key archives
