name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test and Autofix"]
    types:
      - completed
    branches:
      - main

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    # ─────────────────────────────────────────────
    # 1. CHECKOUT & BUILD
    # ─────────────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP ${{ env.PHP_VERSION }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, bcmath, pdo_mysql, curl, zip, gd, fileinfo, dom, exif, iconv
        coverage: none

    - name: Setup Node ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install Composer dependencies (production)
      run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

    - name: Install Node dependencies
      run: npm ci --legacy-peer-deps

    - name: Build production assets
      run: npm run build

    # ─────────────────────────────────────────────
    # 2. ASSEMBLE DEPLOYMENT PACKAGE
    # ─────────────────────────────────────────────
    - name: Assemble deployment package
      run: |
        set -euo pipefail
        mkdir -p deploy-package/backend deploy-package/frontend

        # Backend: everything except public/, dev files, storage contents, .env
        rsync -a \
          --exclude='.env' \
          --exclude='.env.example' \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='tests' \
          --exclude='public' \
          --exclude='storage/framework' \
          --exclude='storage/logs' \
          --exclude='storage/app/public' \
          --exclude='deploy-package' \
          --exclude='*.md' \
          --exclude='.phpunit.result.cache' \
          ./ deploy-package/backend/

        # Frontend: built assets + webroot entry files
        mkdir -p deploy-package/frontend/build
        cp -r public/build/. deploy-package/frontend/build/
        cp public/.htaccess deploy-package/frontend/.htaccess

        # Generate frontend index.php with paths pointing to backend
        sed \
          -e "s|__DIR__.'/../storage/|__DIR__.'/../tfe-core/storage/|g" \
          -e "s|__DIR__.'/../vendor/|__DIR__.'/../tfe-core/vendor/|g" \
          -e "s|__DIR__.'/../bootstrap/|__DIR__.'/../tfe-core/bootstrap/|g" \
          public/index.php > deploy-package/frontend/index.php

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: deploy-package
        path: deploy-package
        retention-days: 1

    # ─────────────────────────────────────────────
    # 3. SSH SETUP
    # ─────────────────────────────────────────────
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

    # ─────────────────────────────────────────────
    # 4. SYNC FILES TO SERVER
    # ─────────────────────────────────────────────
    - name: Sync backend files
      run: |
        rsync -az --delete \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
          --exclude='.env' \
          --exclude='storage' \
          deploy-package/backend/ \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.BACKEND_PATH }}/"

    - name: Sync frontend build assets
      run: |
        rsync -az --delete \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
          deploy-package/frontend/build/ \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.FRONTEND_PATH }}/build/"

    - name: Sync frontend entrypoint files
      run: |
        rsync -az \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
          deploy-package/frontend/.htaccess deploy-package/frontend/index.php \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.FRONTEND_PATH }}/"

    # ─────────────────────────────────────────────
    # 5. POST-DEPLOY COMMANDS
    # ─────────────────────────────────────────────
    - name: Run post-deploy commands
      run: |
        ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "BACKEND_PATH='${{ secrets.BACKEND_PATH }}' FRONTEND_PATH='${{ secrets.FRONTEND_PATH }}' bash -s" \
          < scripts/post-deploy.sh

    # ─────────────────────────────────────────────
    # 6. VERIFY DEPLOYMENT
    # ─────────────────────────────────────────────
    - name: Verify deployed file structure
      run: |
        ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "BACKEND_PATH='${{ secrets.BACKEND_PATH }}' FRONTEND_PATH='${{ secrets.FRONTEND_PATH }}' bash -s" \
          < scripts/verify-deploy.sh

    # ─────────────────────────────────────────────
    # 7. CLEANUP
    # ─────────────────────────────────────────────
    - name: Clean up
      if: always()
      run: |
        rm -rf ~/.ssh/deploy_key deploy-package
        echo "Cleanup complete."
