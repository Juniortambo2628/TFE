name: Deploy to Production

on:
  workflow_run:
    workflows: ["Test and Autofix"]
    types:
      - completed
    branches:
      - main

env:
  SSH_HOST: 51.89.113.223
  SSH_USER: zhpebukm
  SSH_PORT: 1624
  BACKEND_DIR: /home/zhpebukm/tfe-core
  FRONTEND_DIR: /home/zhpebukm/tfe.okjtech.co.ke
  PHP_VERSION: '8.3'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    # ─────────────────────────────────────────────
    # 1. CHECKOUT & BUILD
    # ─────────────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP ${{ env.PHP_VERSION }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, fileinfo
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer dependencies (production)
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader --no-dev

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-node-

    - name: Install NPM dependencies
      run: npm install --legacy-peer-deps

    - name: Build production assets
      run: npm run build

    # ─────────────────────────────────────────────
    # 2. SSH SETUP
    # ─────────────────────────────────────────────
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p ${{ env.SSH_PORT }} ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

    # ─────────────────────────────────────────────
    # 3. PRE-DEPLOYMENT: Prepare server directories
    # ─────────────────────────────────────────────
    - name: Prepare server directories
      run: |
        ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'ENDSSH'
          # Create backend directory if it doesn't exist
          mkdir -p ${{ env.BACKEND_DIR }}
          mkdir -p ${{ env.BACKEND_DIR }}/storage/app/public
          mkdir -p ${{ env.BACKEND_DIR }}/storage/framework/cache/data
          mkdir -p ${{ env.BACKEND_DIR }}/storage/framework/sessions
          mkdir -p ${{ env.BACKEND_DIR }}/storage/framework/views
          mkdir -p ${{ env.BACKEND_DIR }}/storage/logs
          mkdir -p ${{ env.BACKEND_DIR }}/bootstrap/cache

          # Create frontend directory if it doesn't exist
          mkdir -p ${{ env.FRONTEND_DIR }}

          echo "✅ Server directories prepared."
        ENDSSH

    # ─────────────────────────────────────────────
    # 4. PREPARE .ENV & COMPRESS (rsync alternative)
    # ─────────────────────────────────────────────
    - name: Prepare production .env
      env:
        SECRET_ENV: ${{ secrets.PRODUCTION_ENV }}
      run: |
        if [ -n "$SECRET_ENV" ]; then
          echo "$SECRET_ENV" > .env
          echo "✅ .env created from GitHub Secrets."
        else
          echo "⚠️  WARNING: PRODUCTION_ENV secret is empty. Using .env.example.production..."
          cp .env.example.production .env
        fi

    - name: Compress deployment files
      run: |
        tar -czf ../deploy.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='storage/app/public/*' \
          --exclude='storage/framework/sessions/*' \
          --exclude='storage/framework/cache/data/*' \
          --exclude='storage/framework/views/*' \
          --exclude='storage/logs/*' \
          --exclude='github-actions-thefootballexperience*' \
          --exclude='The-Football-Experience' \
          --exclude='.phpunit.result.cache' \
          --exclude='production_env.txt' \
          .

    - name: Upload and extract deployment files
      run: |
        cat ../deploy.tar.gz | ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no ${{ env.SSH_USER }}@${{ env.SSH_HOST }} 'cat > /tmp/deploy.tar.gz'
        ssh -p ${{ env.SSH_PORT }} -o StrictHostKeyChecking=no ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'ENDSSH'
          tar -xzf /tmp/deploy.tar.gz -C ${{ env.BACKEND_DIR }}
          rm /tmp/deploy.tar.gz
        ENDSSH

    # ─────────────────────────────────────────────
    # 5. POST-DEPLOY: Run server-side commands
    # ─────────────────────────────────────────────
    - name: Run deployment commands on server
      run: |
        ssh -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'ENDSSH'
          set -e
          cd ${{ env.BACKEND_DIR }}

          echo "─── Setting permissions ───"
          chmod -R 775 storage bootstrap/cache
          find storage -type d -exec chmod 775 {} \;
          find storage -type f -exec chmod 664 {} \;
          find bootstrap/cache -type d -exec chmod 775 {} \;

          echo "─── Ensure app key is set ───"
          php artisan key:generate --force || true

          echo "─── Running Composer post-install scripts ───"
          php artisan package:discover --ansi 2>/dev/null || true

          echo "─── Running migrations ───"
          php artisan migrate --force

          echo "─── Clearing & rebuilding caches ───"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache 2>/dev/null || true

          echo "─── Setting up storage symlink ───"
          if ! php artisan storage:link --force 2>/dev/null; then
            echo "⚠️  php artisan storage:link failed (exec disabled), attempting manual symlink..."
            rm -rf public/storage
            ln -sfn ../storage/app/public public/storage
            echo "✅ Manual storage symlink created."
          fi

          echo "─── Setting up API symlink ───"
          # Symlink: tfe.okjtech.co.ke/api -> tfe-core/public
          if [ -L "${{ env.FRONTEND_DIR }}/api" ]; then
            CURRENT_TARGET=$(readlink -f "${{ env.FRONTEND_DIR }}/api")
            EXPECTED_TARGET=$(readlink -f "${{ env.BACKEND_DIR }}/public")
            if [ "$CURRENT_TARGET" = "$EXPECTED_TARGET" ]; then
              echo "✅ API symlink already correct."
            else
              echo "🔄 Updating API symlink..."
              rm -f "${{ env.FRONTEND_DIR }}/api"
              ln -sfn "${{ env.BACKEND_DIR }}/public" "${{ env.FRONTEND_DIR }}/api"
              echo "✅ API symlink updated."
            fi
          else
            # Remove directory/file if it exists and isn't a symlink
            rm -rf "${{ env.FRONTEND_DIR }}/api"
            ln -sfn "${{ env.BACKEND_DIR }}/public" "${{ env.FRONTEND_DIR }}/api"
            echo "✅ API symlink created."
          fi

          echo ""
          echo "═══════════════════════════════════════════"
          echo "  POST-DEPLOYMENT VERIFICATION"
          echo "═══════════════════════════════════════════"

          echo ""
          echo "─── Checking expected file structure ───"
          ERRORS=0

          # Backend checks
          for f in artisan composer.json public/index.php bootstrap/app.php config/app.php; do
            if [ -f "${{ env.BACKEND_DIR }}/$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ MISSING: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Directory checks
          for d in app config database public resources routes storage vendor bootstrap; do
            if [ -d "${{ env.BACKEND_DIR }}/$d" ]; then
              echo "  ✅ $d/"
            else
              echo "  ❌ MISSING: $d/"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Built assets check
          if [ -d "${{ env.BACKEND_DIR }}/public/build" ]; then
            ASSET_COUNT=$(find "${{ env.BACKEND_DIR }}/public/build" -type f | wc -l)
            echo "  ✅ public/build/ ($ASSET_COUNT files)"
          else
            echo "  ❌ MISSING: public/build/ (Vite assets not built!)"
            ERRORS=$((ERRORS + 1))
          fi

          # Symlink checks
          echo ""
          echo "─── Checking symlinks ───"
          if [ -L "${{ env.FRONTEND_DIR }}/api" ]; then
            TARGET=$(readlink "${{ env.FRONTEND_DIR }}/api")
            echo "  ✅ ${{ env.FRONTEND_DIR }}/api -> $TARGET"
          else
            echo "  ❌ API symlink missing!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ -L "${{ env.BACKEND_DIR }}/public/storage" ]; then
            TARGET=$(readlink "${{ env.BACKEND_DIR }}/public/storage")
            echo "  ✅ public/storage -> $TARGET"
          else
            echo "  ⚠️  public/storage symlink missing (run php artisan storage:link)"
          fi

          # Entry point check
          echo ""
          echo "─── Checking API entry point ───"
          if [ -f "${{ env.FRONTEND_DIR }}/api/index.php" ]; then
            echo "  ✅ ${{ env.FRONTEND_DIR }}/api/index.php exists"
          else
            echo "  ❌ Entry point not accessible!"
            ERRORS=$((ERRORS + 1))
          fi

          # Permissions check
          echo ""
          echo "─── Checking write permissions ───"
          if [ -w "${{ env.BACKEND_DIR }}/storage/logs" ]; then
            echo "  ✅ storage/logs is writable"
          else
            echo "  ❌ storage/logs is NOT writable"
            ERRORS=$((ERRORS + 1))
          fi

          if [ -w "${{ env.BACKEND_DIR }}/bootstrap/cache" ]; then
            echo "  ✅ bootstrap/cache is writable"
          else
            echo "  ❌ bootstrap/cache is NOT writable"
            ERRORS=$((ERRORS + 1))
          fi

          echo ""
          echo "═══════════════════════════════════════════"
          if [ $ERRORS -eq 0 ]; then
            echo "  🎉 DEPLOYMENT SUCCESSFUL — 0 errors"
          else
            echo "  ⚠️  DEPLOYMENT COMPLETED WITH $ERRORS ERROR(S)"
          fi
          echo "  📅 $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "═══════════════════════════════════════════"

        ENDSSH

    # ─────────────────────────────────────────────
    # 6. CLEANUP: Remove build artifacts from runner
    # ─────────────────────────────────────────────
    - name: Post-deployment cleanup
      if: always()
      run: |
        rm -rf node_modules vendor
        echo "✅ Runner cleanup complete."
