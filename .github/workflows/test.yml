name: Test and Autofix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup PHP 8.3
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-node-

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate application key
      run: php artisan key:generate

    - name: Install NPM dependencies
      run: npm install --legacy-peer-deps

    - name: Build frontend assets
      run: npm run build

    # The JS unit tests (lib/*, guards) were never run in CI before Sprint 69.
    - name: Run JS unit tests
      run: npm run test:js

    - name: Set directory permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create SQLite database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Run migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    # ─── AUTOFIX: Run Laravel Pint ───
    - name: Run Pint (code style autofix)
      run: ./vendor/bin/pint || true

    - name: Commit Pint autofixes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: apply Laravel Pint autofixes"
        branch: ${{ github.head_ref || github.ref_name }}

    # ─── TEST SUITE ───
    - name: Run test suite
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

    # ─── BROWSER SMOKE (Sprint 69) ───
    # What the PHP suite cannot see: dialogs that clip or render off-screen,
    # a chart that never draws, a save that fails in the browser.
    - name: Seed demo data for the browser tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate:fresh --seed --force

    - name: Start the app
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: |
        php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
        for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done

    - name: Install Chromium for Playwright
      run: npx playwright install --with-deps chromium

    - name: Run browser smoke tests
      env:
        CI: true
      run: npm run test:e2e

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report
          test-results
          storage/logs
        retention-days: 7
