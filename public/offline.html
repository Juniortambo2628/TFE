<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>You're offline · The Football Experience</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(60% 50% at 50% 35%, rgba(220, 20, 60, 0.28), transparent 70%), #0a0a0c;
  }
  main { max-width: 360px; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 20px 50px -18px rgba(0,0,0,.8); }
  h1 { margin: 28px 0 10px; font-size: 1.5rem; }
  p { margin: 0; line-height: 1.6; color: rgba(255,255,255,.7); }
  button {
    margin-top: 28px; padding: 0 26px; height: 48px; border: 0; border-radius: 999px;
    background: #fff; color: #000; font: inherit; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>TFE needs a connection for prices, bookings and messages. Your plans are safe: they're saved on your account, not on this phone.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
